name: release
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 建 GitHub Release
      id-token: write   # Trusted Publishing:允許 GitHub 簽發 OIDC token 與 NuGet 交換臨時金鑰
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # SourceLink 需要完整 git 歷史
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -p:Version=${{ steps.ver.outputs.version }} -o ./artifacts

      # Trusted Publishing:用 GitHub OIDC 向 nuget.org 換一把只活 1 小時的臨時金鑰,
      # 不需要保管長效 API key、也不需要 repo secret
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Cornhsu   # nuget.org 使用者名稱(不是 email)

      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          -k ${{ steps.login.outputs.NUGET_API_KEY }}
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate

      # 建 GitHub Release。Marketplace 的版本呈現綁 Release,而使用者被要求 pin @vX.Y.Z 時,
      # Releases 頁是他們唯一看得到「這版改了什麼」的地方 —— 先前四個 repo 幾乎都是空的。
      # 內容直接取自 CHANGELOG 對應那一節,不另外手寫一份(單一事實來源)。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          # CHANGELOG 兩種標題格式都吃:「## 0.12.0」與「## [1.1.0] — 2026-08-07」
          notes=$(awk -v v="$v" '
            /^## / {
              if (found) exit
              line = $0; sub(/^## +\[?/, "", line)
              if (index(line, v) == 1) {
                rest = substr(line, length(v) + 1)
                if (rest !~ /^[0-9.]/) { found = 1; next }
              }
              next
            }
            found { print }
          ' CHANGELOG.md)
          [ -n "$notes" ] || notes="See CHANGELOG.md."
          # 冪等:重跑 job 時改成更新既有 Release,而不是報錯
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release edit "v$v" --notes "$notes"
            echo "✔ 已更新既有 Release v$v"
          else
            gh release create "v$v" --title "v$v" --notes "$notes" --verify-tag
            echo "✔ 已建立 Release v$v"
          fi
