name: ci
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --verbosity normal
      # sample 一定要跟著建置——它是抽象是否成立的哨兵
      - run: dotnet run --project samples/MinimalConsole -c Release
      # README 的守門員:README 教的每一個呼叫都在這裡編譯並執行。
      # 改公開 API 的簽章時,tests/ 會被迫跟著改,README 不會——這一步就是那個「被迫」。
      - run: dotnet run --project samples/ReadmeSnippets -c Release

  # EF Core 9/10:真的引用新版 EF 跑同一套測試(不是只換 SDK)
  test-ef-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ef: "9.0.*"
            tfm: net8.0     # EF 9 支援 net8
            sdk: |
              8.0.x
              9.0.x
          - ef: "10.0.*"
            tfm: net10.0
            sdk: |
              8.0.x
              10.0.x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
      - run: >
          dotnet test tests/Cornhsu.Labeling.Tests -c Release
          -p:CornhsuTestTfm=${{ matrix.tfm }}
          -p:CornhsuEfVersion=${{ matrix.ef }}
          -p:CornhsuDiVersion=${{ matrix.ef }}
      # README 守門員也跑在新版 EF 上。README 承諾「支援 EF Core 8+,消費端用 9/10 會自動
      # unify」,只驗樓地板等於只驗了承諾的下限 —— 而 README 教的 IQueryable 組合、
      # DbContext 建構、IDesignTimeDbContextFactory 都正好是 EF 各版之間會動的東西。
      # 每一輪會印出實際跑到的 EF 版本,所以旗標若被忽略,log 會直接露出來。
      - run: >
          dotnet run --project samples/ReadmeSnippets -c Release
          -p:CornhsuTestTfm=${{ matrix.tfm }}
          -p:CornhsuEfVersion=${{ matrix.ef }}
          -p:CornhsuDiVersion=${{ matrix.ef }}

  # 同一套測試跑在真的 PostgreSQL 上(名稱 collation、DateTimeOffset、Guid 行為都不同)
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Cornhsu.Labeling.Tests -c Release
        env:
          CORNHSU_TEST_PROVIDER: postgres
          CORNHSU_TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres

  # 同一套測試跑在真的 SQL Server 上(collation 預設不區分大小寫、HasMaxLength 會強制)
  test-sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Cornhsu-CI-P4ss!"
        ports: [ "1433:1433" ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Cornhsu-CI-P4ss!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 20s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Cornhsu.Labeling.Tests -c Release
        env:
          CORNHSU_TEST_PROVIDER: sqlserver
          CORNHSU_TEST_SQLSERVER: Server=localhost;User Id=sa;Password=Cornhsu-CI-P4ss!;TrustServerCertificate=true
