name: release
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 建 GitHub Release
      id-token: write   # Trusted Publishing:允許 GitHub 簽發 OIDC token 與 NuGet 交換臨時金鑰
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # SourceLink 需要完整 git 歷史
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # CHANGELOG 是「推 tag 之前」的版本真相源(下面的 Release 說明也取自它)。
      # 兩者不一致就別發:擋在這裡的代價是「tag 已推、但沒發出去」—— 刪 tag 重來即可;
      # 相對地,CHANGELOG 沒寫就發到 nuget.org 是**沒有反悔機會的**。
      # 照 XamlContrast / Parity 的同一道關,2026-11-13 補上 —— 此前這個 repo 沒有。
      - name: Assert CHANGELOG top entry matches the tag
        env:
          REL_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          top=$(grep -m1 -oE '^## +\[?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ "$top" != "$REL_VERSION" ]; then
            echo "✗ tag 是 v$REL_VERSION,但 CHANGELOG.md 最上面那個版本是 ${top:-(沒有)}。先補上 ## $REL_VERSION 的段落再重推 tag。"
            exit 1
          fi
          # 第 15 步要發的 Release 內容就是從這一節抽出來的。抽取放在這裡,是因為這裡還在
          # 「推上 nuget.org 之前」——抽不到就是「標題寫了但底下沒內容」,此時刪 tag 重來還救得回來。
          # CHANGELOG 兩種標題格式都吃:「## 0.12.0」與「## [1.1.0] — 2026-08-07」
          notes=$(awk -v v="$REL_VERSION" '
            /^## / {
              if (found) exit
              line = $0; sub(/^## +\[?/, "", line)
              if (index(line, v) == 1) {
                rest = substr(line, length(v) + 1)
                if (rest !~ /^[0-9.]/) { found = 1; next }
              }
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "✗ CHANGELOG.md 有 ## $REL_VERSION 的標題,但底下沒有內容。"
            echo "  GitHub Release 的內容就是從這一節抽出來的 —— 使用者被要求 pin @v$REL_VERSION 時,"
            echo "  Releases 頁是他們唯一看得到這版改了什麼的地方。把那一節寫完,再重推 tag。"
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
          echo "✓ CHANGELOG 頂端 $top 與 tag 一致,Release 內容已備妥($(printf '%s\n' "$notes" | wc -l) 行)"

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -p:Version=${{ steps.ver.outputs.version }} -o ./artifacts

      # Trusted Publishing:用 GitHub OIDC 向 nuget.org 換一把只活 1 小時的臨時金鑰,
      # 不需要保管長效 API key、也不需要 repo secret
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0(v1 當時所指的 commit)
        id: login
        with:
          user: Cornhsu   # nuget.org 使用者名稱(不是 email)

      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          -k ${{ steps.login.outputs.NUGET_API_KEY }}
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate

      # 建 GitHub Release。Marketplace 的版本呈現綁 Release,而使用者被要求 pin @vX.Y.Z 時,
      # Releases 頁是他們唯一看得到「這版改了什麼」的地方 —— 先前四個 repo 幾乎都是空的。
      # 內容直接取自 CHANGELOG 對應那一節,不另外手寫一份(單一事實來源)。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          # 內容在「Assert CHANGELOG top entry matches the tag」那一步就抽好了,這裡只負責發。
          # 抽取刻意不放在這裡:這一步跑到的時候套件已經推上 nuget.org,不可逆了——
          # 那時才發現 CHANGELOG 那一節是空的,失敗也救不回任何東西,只會變成「套件出去了但沒有 Release」。
          notes_file="$RUNNER_TEMP/release-notes.md"
          [ -s "$notes_file" ] || { echo "✗ 找不到前面備妥的 Release 內容:$notes_file"; exit 1; }
          # 冪等:重跑 job 時改成更新既有 Release,而不是報錯
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release edit "v$v" --notes-file "$notes_file"
            echo "✔ 已更新既有 Release v$v"
          else
            gh release create "v$v" --title "v$v" --notes-file "$notes_file" --verify-tag
            echo "✔ 已建立 Release v$v"
          fi
